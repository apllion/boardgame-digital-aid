name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Imperial Elegy
        working-directory: imperial-elegy
        run: |
          npm ci
          npm run build

      - name: Build Coinbots
        working-directory: coinbots
        run: |
          npm ci
          npm run build

      - name: Build Star Realms
        working-directory: star-realms
        run: |
          npm ci
          npm run build

      - name: Build Space Empires
        working-directory: space-empires
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/imperial-elegy _site/coinbots _site/star-realms _site/space-empires
          cp index.html _site/
          cp -r imperial-elegy/dist/* _site/imperial-elegy/
          cp -r coinbots/dist/* _site/coinbots/
          cp -r star-realms/dist/* _site/star-realms/
          cp -r space-empires/dist/* _site/space-empires/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
